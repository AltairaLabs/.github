<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="500" fill="#0F172A"/>

  <!-- Star constellation mark - centered and scaled -->
  <g transform="translate(250, 220) scale(4)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="3" fill="#3B82F6"/>
    <!-- Upper node -->
    <circle cx="0" cy="-14" r="2.5" fill="#3B82F6"/>
    <!-- Side nodes -->
    <circle cx="-12" cy="-2" r="2" fill="#06B6D4"/>
    <circle cx="12" cy="-2" r="2" fill="#06B6D4"/>
    <!-- Lower nodes -->
    <circle cx="-8" cy="12" r="1.5" fill="#8B5CF6"/>
    <circle cx="8" cy="12" r="1.5" fill="#8B5CF6"/>

    <!-- Connecting lines -->
    <line x1="0" y1="-11.5" x2="0" y2="-3" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-10" y1="-2" x2="-3" y2="0" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="-2" x2="3" y2="0" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-7" y1="11" x2="-2" y2="2" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="11" x2="2" y2="2" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="250" y="360" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="0.05em" fill="#F8FAFC">ALTAIRA</text>
  <text x="250" y="410" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="400" letter-spacing="0.25em" fill="#64748B">LABS</text>
</svg>
